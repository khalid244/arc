# =============================================================================
# Arc Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
[server]
port = 8000

# TLS/HTTPS (disabled by default)
tls_enabled = false
# tls_cert_file = "/etc/letsencrypt/live/example.com/fullchain.pem"
# tls_key_file = "/etc/letsencrypt/live/example.com/privkey.pem"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[log]
level = "info"      # debug, info, warn, error, fatal, panic
format = "console"  # json or console

# -----------------------------------------------------------------------------
# Database (DuckDB)
# -----------------------------------------------------------------------------
# Auto-configured based on system resources if not set.
# Override via: ARC_DATABASE_MAX_CONNECTIONS, ARC_DATABASE_MEMORY_LIMIT, ARC_DATABASE_THREAD_COUNT
[database]
# max_connections = 28    # Default: 2x CPU cores
# memory_limit = "8GB"    # Default: ~50% system memory
# thread_count = 14       # Default: CPU cores
enable_wal = true

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
[storage]
backend = "local"           # "local" or "s3"
local_path = "./data/arc"

# S3/MinIO (when backend = "s3")
s3_bucket = "arc-test"
s3_region = "us-east-2"
s3_endpoint = ""            # Empty for AWS, set for MinIO
s3_use_ssl = false          # Set true for production
s3_path_style = true        # True for MinIO, false for AWS
# Credentials via env: ARC_STORAGE_S3_ACCESS_KEY, ARC_STORAGE_S3_SECRET_KEY

# -----------------------------------------------------------------------------
# Ingestion
# -----------------------------------------------------------------------------
[ingest]
max_buffer_size = 5000000   # Records before flush (default: 50000)
max_buffer_age_ms = 100   # Max buffer age before flush

# Sort keys for compression/query performance: "measurement:col1,col2"
# Time column is always appended automatically
sort_keys = []
default_sort_keys = ""

# LateStager: batch late-event parquets locally and upload one merged file per
# flush window via DuckDB COPY(union_by_name=true). Without this, every
# schema-change flush emits its own events_late/ object (tens of thousands/hour
# under posthog mobile traffic) — the reorganizer cannot drain that. 0 =
# disabled (inline upload). 60000 (60s) recommended in prod.
late_stager_flush_age_ms = 0
late_stager_directory = "./data/ingest/late-stager"
# FreshStager: same coalescing for the FRESH events/Y/M/D/H/ path; merges +
# re-partitions on flush. Cuts compactor load dramatically. 0 = disabled.
fresh_stager_flush_age_ms = 0
fresh_stager_directory = "./data/ingest/fresh-stager"

# -----------------------------------------------------------------------------
# Compaction
# -----------------------------------------------------------------------------
[compaction]
enabled = true

# Hourly
hourly_enabled = true
hourly_schedule = "5 * * * *"
hourly_min_age_hours = 1
hourly_min_files = 10

# Daily
daily_enabled = true
daily_schedule = "0 3 * * *"
daily_min_age_hours = 24
daily_min_files = 12

# -----------------------------------------------------------------------------
# Reorg (late-event reorganizer)
# -----------------------------------------------------------------------------
# Drains files written by the ingest late-routing hook from the flat sidecar
# layout (<db>/<measurement><suffix>/) back into the standard Y/M/D/H
# partitioned layout under <measurement>. Disabled by default.
[reorg]
enabled = false
schedule = "*/15 * * * *"   # cron; every 15 min
min_age_seconds = 3600      # 1h: only drain fully-closed hour buckets
# memory_limit = ""         # DuckDB memory_limit for the reorg process (empty = auto)
temp_directory = "./data/reorg"
max_concurrent = 1          # parallel buckets processed per cycle
max_files_per_batch = 2000  # chunk size for DuckDB COPY per bucket
download_workers = 8        # parallel S3 download workers per bucket
# Hard deadline for one reorg cycle. Mirrors [compaction].cycle_timeout. 30m
# suits steady-state; raise to "2h"/"3h" during backlog catch-up so a cycle
# drains meaningful work instead of cancelling mid-bucket and rolling back.
# viper / time.ParseDuration only knows ns/us/ms/s/m/h -- "30d" parses to 0.
cycle_timeout = "30m"
# Oldest-first cap on closed hour-buckets drained per cycle. Bounds each run
# to a completable unit of work (committed on success) so the backlog shrinks
# monotonically. Set 0 (unlimited) together with a larger cycle_timeout and
# higher max_concurrent during a one-off backlog catch-up, then revert.
max_buckets_per_run = 4

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
[auth]
enabled = true

# -----------------------------------------------------------------------------
# Delete
# -----------------------------------------------------------------------------
[delete]
enabled = true
confirmation_threshold = 10000
max_rows_per_delete = 1000000

# -----------------------------------------------------------------------------
# Retention
# -----------------------------------------------------------------------------
[retention]
enabled = true

# -----------------------------------------------------------------------------
# Continuous Queries
# -----------------------------------------------------------------------------
[continuous_query]
enabled = false

# -----------------------------------------------------------------------------
# MQTT
# -----------------------------------------------------------------------------
[mqtt]
enabled = false

# -----------------------------------------------------------------------------
# Query
# -----------------------------------------------------------------------------
[query]
# Slow query logging threshold in milliseconds (0 = disabled)
# Queries exceeding this threshold emit a WARN log and increment arc_slow_queries_total
# slow_query_threshold_ms = 1000

# S3 file caching (improves CTEs, subqueries, dashboard queries)
enable_s3_cache = false
s3_cache_size = "128MB"
s3_cache_ttl_seconds = 3600

# -----------------------------------------------------------------------------
# Telemetry
# -----------------------------------------------------------------------------
[telemetry]
enabled = true

# -----------------------------------------------------------------------------
# Tiered Storage (Enterprise)
# -----------------------------------------------------------------------------
# Hot tier (local) -> Cold tier (S3/Azure) based on data age
[tiered_storage]
enabled = false
migration_schedule = "0 2 * * *"
migration_max_concurrent = 4
migration_batch_size = 100
default_hot_max_age_days = 0

[tiered_storage.cold]
enabled = false
backend = "s3"              # "s3" or "azure"

# S3/MinIO
s3_bucket = "arc-archive"
s3_region = "us-east-1"
s3_endpoint = "localhost:9000"
s3_access_key = "minioadmin"
s3_secret_key = "minioadmin"
s3_use_ssl = false
s3_path_style = true
s3_storage_class = "GLACIER"

# Azure (when backend = "azure")
azure_container = ""
azure_endpoint = ""
azure_use_managed_identity = false
azure_access_tier = "Archive"

retrieval_mode = "standard"  # standard, expedited, bulk

# -----------------------------------------------------------------------------
# Audit Logging (Enterprise)
# -----------------------------------------------------------------------------
[audit_log]
enabled = false
retention_days = 90
include_reads = false           # Log GET/query requests (high volume)

# Backup & Restore
# -----------------------------------------------------------------------------
[backup]
enabled = true
local_path = "./data/backups"           # Directory for local backups

# Query Management (Enterprise)
# -----------------------------------------------------------------------------
# [query_management]
# enabled = false
# history_size = 100              # Number of completed queries to keep in memory

[wal]
enabled = false